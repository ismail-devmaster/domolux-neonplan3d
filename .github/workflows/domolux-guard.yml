name: Domolux Guard

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  guard:
    name: Verify Domolux Trust & Version Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Domolux Guardrail Checks
        run: python3 tools/domolux_guard.py
